name: Diagnose
on:
  workflow_dispatch:
    inputs:
      places:
        description: 'lat,lon,name;...'
        default: '39.0437,-77.4875,Ashburn, VA'
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i --no-save playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/diag.mjs
        env:
          PLACES: ${{ inputs.places }}
      - run: |
          git config user.name skyline-bot; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/diag.json; git commit -m "Diagnostic run"; for i in 1 2 3; do git pull --rebase -X theirs -q origin main && git push -q && exit 0; sleep 5; done
