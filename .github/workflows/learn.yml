name: Nightly forecast verification
on:
  schedule:
    - cron: '17 11 * * *'   # about 7 AM Eastern, after the overnight climate reports
  workflow_dispatch:
permissions:
  contents: write
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i --no-save playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/learn.mjs
      - name: Commit results
        run: |
          git config user.name "skyline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots.json data/learning.json
          git diff --cached --quiet || git commit -m "Nightly forecast verification"
          git push
