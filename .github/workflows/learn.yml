name: Forecast verification
on:
  schedule:
    - cron: '17 1,7,13,19 * * *'   # four times a day (9 PM, 3 AM, 9 AM, 3 PM Eastern daylight time)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: learn
  cancel-in-progress: false
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i --no-save playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/learn.mjs
      - name: Commit results
        run: |
          git config user.name "skyline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots.json data/hourly_snaps.json data/learning.json
          git diff --cached --quiet && exit 0
          git commit -m "Forecast verification"
          for i in 1 2 3; do git pull --rebase -X theirs -q origin main && git push -q && exit 0; git rebase --abort 2>/dev/null; sleep 10; done
          exit 1
