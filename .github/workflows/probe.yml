name: Probe radar legend
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, collections, io, datetime as dt
          from PIL import Image
          IS='https://mapservices.weather.noaa.gov/eventdriven/rest/services/radar/radar_base_reflectivity_time/ImageServer'
          info=json.load(urllib.request.urlopen(IS+'?f=json',timeout=60))
          tEnd=info['timeInfo']['timeExtent'][1]
          res={}
          for back in (0,10,20,30):
              T=dt.datetime.utcfromtimestamp(tEnd/1000)-dt.timedelta(minutes=back)
              T=T.replace(minute=T.minute-T.minute%5, second=0, microsecond=0)
              url=f"https://mesonet.agron.iastate.edu/archive/data/{T:%Y/%m/%d}/GIS/uscomp/n0q_{T:%Y%m%d%H%M}.png"
              try: im=Image.open(io.BytesIO(urllib.request.urlopen(url,timeout=120).read()))
              except Exception as e: res.setdefault('err',[]).append(url+' '+str(e)[:80]); continue
              W,H=im.size; px=im.load()
              ms=int(T.replace(tzinfo=dt.timezone.utc).timestamp()*1000)
              pts=[]
              for (la0,la1,lo0,lo1) in [(34,42,-82,-74),(26,36,-100,-86),(38,48,-98,-84)]:
                  pts+=[[round(lo0+(lo1-lo0)*x/59,3), round(la0+(la1-la0)*y/59,3)] for y in range(60) for x in range(60)]
              pairs=collections.defaultdict(list)
              for k in range(0,len(pts),700):
                  chunk=pts[k:k+700]
                  body=urllib.parse.urlencode({'geometry':json.dumps({'points':chunk,'spatialReference':{'wkid':4326}}),'geometryType':'esriGeometryMultipoint','returnFirstValueOnly':'true','interpolation':'RSP_NearestNeighbor','time':str(ms),'f':'json'}).encode()
                  try: j=json.load(urllib.request.urlopen(urllib.request.Request(IS+'/getSamples',data=body),timeout=90))
                  except Exception as e: res.setdefault('err',[]).append(str(e)[:80]); continue
                  for s in j.get('samples',[]):
                      i=s['locationId']; lo,la=chunk[i]
                      x=int(round((lo+126)/0.005)); y=int(round((50-la)/0.005))
                      if not (0<=x<W and 0<=y<H): continue
                      v=px[x,y]; dbz=None if v==0 else v*0.5-32.5
                      pairs[s['value']].append(dbz)
              res[str(T)]={c:sorted([d for d in v if d is not None]) + [None]*sum(1 for d in v if d is None) for c,v in pairs.items()}
          json.dump(res,open('data/radar_probe.json','w'))
          PY
          git config user.name skyline-bot; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/radar_probe.json; git commit -m probe; git pull --rebase -q origin main; git push -q
