name: Probe radar legend
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, collections
          IS='https://mapservices.weather.noaa.gov/eventdriven/rest/services/radar/radar_base_reflectivity_time/ImageServer/getSamples'
          cnt=collections.Counter()
          for (la0,la1,lo0,lo1) in [(35,42,-83,-74),(28,35,-100,-88),(40,48,-98,-86),(30,40,-125,-110)]:
              pts=[[round(lo0+(lo1-lo0)*x/44,3), round(la0+(la1-la0)*y/44,3)] for y in range(45) for x in range(45)]
              for k in range(0,len(pts),700):
                  body=urllib.parse.urlencode({'geometry':json.dumps({'points':pts[k:k+700],'spatialReference':{'wkid':4326}}),'geometryType':'esriGeometryMultipoint','returnFirstValueOnly':'true','f':'json'}).encode()
                  try:
                      j=json.load(urllib.request.urlopen(urllib.request.Request(IS,data=body),timeout=60))
                      for s in j.get('samples',[]): cnt[s['value']]+=1
                  except Exception as e: cnt['ERR '+str(e)[:60]]+=1
          json.dump(cnt.most_common(),open('data/radar_probe.json','w'),indent=0)
          PY
          git config user.name skyline-bot; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/radar_probe.json; git commit -m probe; git pull --rebase -q origin main; git push -q
