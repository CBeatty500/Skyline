name: probe
on: workflow_dispatch
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data; f=data/probe.txt; : > $f
          H='-s -m 30 -H Origin:https://cbeatty500.github.io'
          echo "== CurrentStorms headers" >> $f; curl $H -D - -o /tmp/cs.json https://www.nhc.noaa.gov/CurrentStorms.json | grep -i 'access-control\|HTTP/' >> $f; head -c 3000 /tmp/cs.json >> $f; echo >> $f
          B=https://mapservices.weather.noaa.gov/tropical/rest/services/tropical/NHC_tropical_weather/MapServer
          echo "== mapserver layers" >> $f; curl $H -D /tmp/h "$B?f=json" | python3 -c "import json,sys; j=json.load(sys.stdin); [print(l['id'],l['name'],l.get('parentLayerId'),l.get('geometryType')) for l in j.get('layers',[])]" >> $f; grep -i 'access-control' /tmp/h >> $f
          echo "== cone AT1 fields" >> $f; for id in 6 7 8; do curl $H "$B/$id?f=json" | python3 -c "import json,sys; j=json.load(sys.stdin); print(j.get('id'),j.get('name'),[x['name'] for x in (j.get('fields') or [])])" >> $f; done
          echo "== any cone features" >> $f; curl $H "$B/query?f=json" >> /dev/null
          for id in $(seq 0 140); do n=$(curl $H "$B/$id/query?where=1%3D1&returnCountOnly=true&f=json" | python3 -c "import json,sys;print(json.load(sys.stdin).get('count'))" 2>/dev/null); [ "$n" != "0" ] && [ "$n" != "None" ] && [ -n "$n" ] && echo "layer $id count $n" >> $f; done
          echo "== TWO" >> $f; curl $H -D - -o /tmp/two.json "https://www.nhc.noaa.gov/xgtwo/two_atl_7d0.json" | grep -i 'HTTP/\|access-control' >> $f
          git config user.name CBeatty500; git config user.email 343234935+CBeatty500@users.noreply.github.com
          git add data/probe.txt; git commit -qm "probe"; git pull -q --rebase -X theirs; git push -q
