name: probe
on: workflow_dispatch
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data; f=data/probe.txt; : > $f
          H='-s -m 30 -H Origin:https://cbeatty500.github.io'
          B=https://mapservices.weather.noaa.gov/tropical/rest/services/tropical/NHC_tropical_weather/MapServer
          C=8,34,60,86,112,138,164,190,216,242,268,294,320,346,372
          for P in "-104.3,19.05" "-77.49,39.04"; do
            echo "== identify cones $P" >> $f
            curl $H "$B/identify?geometry=$P&geometryType=esriGeometryPoint&sr=4326&layers=all:$C,395,396,397,3&tolerance=1&mapExtent=-180,0,0,70&imageDisplay=1800,700,96&returnGeometry=false&f=json" | head -c 2500 >> $f; echo >> $f
          done
          echo "== mapserver-level query" >> $f
          curl $H "$B/query?layerDefs=%7B%22136%22%3A%22tau%3D0%22%2C%226%22%3A%22tau%3D0%22%7D&geometry=-120,5,-90,30&geometryType=esriGeometryEnvelope&inSR=4326&outSR=4326&returnGeometry=true&f=json" | head -c 1500 >> $f; echo >> $f
          echo "== layer query distance" >> $f
          curl $H "$B/136/query?where=1%3D1&geometry=-104.3,19.05&geometryType=esriGeometryPoint&inSR=4326&distance=1000&units=esriSRUnit_StatuteMile&outFields=stormname,stormtype,maxwind,gust,tcdir,tcspd,tau,datelbl,lat,lon,advdate,dvlbl,binnumber,stormnum,basin&returnGeometry=false&f=json" | head -c 3000 >> $f; echo >> $f
          for id in 395 3; do curl $H "$B/$id?f=json" | python3 -c "import json,sys; j=json.load(sys.stdin); print(j.get('id'),j.get('name'),[x['name'] for x in (j.get('fields') or [])])" >> $f; done
          curl $H "$B/3/query?where=1%3D1&outFields=*&returnGeometry=false&f=json" | head -c 1500 >> $f; echo >> $f
          git config user.name CBeatty500; git config user.email 343234935+CBeatty500@users.noreply.github.com
          git add data/probe.txt; git commit -qm "probe"; git pull -q --rebase -X theirs; git push -q
