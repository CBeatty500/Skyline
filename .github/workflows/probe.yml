name: Probe observations
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -s -H 'User-Agent: (Skyline probe, github.com/CBeatty500/Skyline)' 'https://api.weather.gov/stations/KIAD/observations?limit=40' | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          out=[{'t':f['properties']['timestamp'],'raw':f['properties'].get('rawMessage'),'txt':f['properties'].get('textDescription')} for f in d.get('features',[])]
          json.dump(out,open('data/probe.json','w'),indent=0)"
          git config user.name skyline-bot; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/probe.json; git commit -m "probe"; git pull --rebase -q origin main; git push -q
