name: Probe radar legend
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          IS=https://mapservices.weather.noaa.gov/eventdriven/rest/services/radar/radar_base_reflectivity_time/ImageServer
          curl -s "$IS/legend?f=json" > /tmp/legend.json
          curl -s "$IS?f=json" > /tmp/info.json
          # samples along a line through northern Virginia right now
          PTS='{"points":[[-77.49,39.04],[-77.75,38.7],[-77.9,38.45],[-78.1,38.3],[-77.5,38.3],[-77.0,38.6],[-76.7,39.3],[-76.6,39.4],[-77.4,38.0],[-77.45,37.55]],"spatialReference":{"wkid":4326}}'
          curl -s -X POST "$IS/getSamples" --data-urlencode "geometry=$PTS" -d geometryType=esriGeometryMultipoint -d returnFirstValueOnly=true -d f=json > /tmp/samples.json
          python3 -c "
          import json
          json.dump({'legend':json.load(open('/tmp/legend.json')),'info':{k:v for k,v in json.load(open('/tmp/info.json')).items() if k in ('pixelType','bandCount','minValues','maxValues','hasColormap','hasRasterAttributeTable','rasterFunctionInfos','timeInfo','serviceDataType')},'samples':json.load(open('/tmp/samples.json'))},open('data/radar_probe.json','w'),indent=0)"
          git config user.name skyline-bot; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/radar_probe.json; git commit -m probe; git pull --rebase -q origin main; git push -q
